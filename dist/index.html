<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FM Task Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #FAFBFC;
        --surface: #FFFFFF;
        --surface-2: #F4F6F9;
        --border: #E7EAF0;
        --border-strong: #CBD3E0;
        --text: #1A1F36;
        --text-2: #6B7488;
        --text-3: #9097A8;

        --bupa-blue: #0050A0;
        --bupa-blue-bright: #2D8FE0;
        --accent: #0050A0;
        --accent-light: #E0F2FF;

        --danger: #C23B3B;
        --danger-light: #FCEBED;
        --warning: #B36B1E;
        --warning-light: #FCF1E6;
        --info: #2B6CA3;
        --info-light: #EAF4FB;
        --success: #2D7D4C;
        --success-light: #EDF7F0;

        --radius: 10px;
        --radius-lg: 18px;
        --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body {
        margin: 0;
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
      }
      button { font-family: inherit; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: 0.55; }
      input, select, textarea { font-family: inherit; }
      input::placeholder, textarea::placeholder { color: var(--text-3); }

      /* Make the native date-picker indicator clearly visible and clickable everywhere */
      input[type="date"] {
        position: relative;
        color-scheme: light;
      }
      input[type="date"]::-webkit-calendar-picker-indicator {
        opacity: 1;
        cursor: pointer;
        filter: none;
        padding: 4px;
        border-radius: 6px;
      }
      input[type="date"]::-webkit-calendar-picker-indicator:hover {
        background: var(--surface-2);
      }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
      #root { min-height: 100vh; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BLx2xXHt.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
